# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.documents_dir: '%kernel.project_dir%/var/documents'
    app.documents_max_bytes: 10485760
    app.chunk_size: 800
    app.chunk_overlap: 150
    app.rag_top_k: 5
    app.rag_candidate_batch_size: 25
    app.rag_min_score: 0.2

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    _instanceof:
        App\Service\Document\TextExtractorInterface:
            tags: ['app.text_extractor']

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Service\Embedding\EmbeddingProviderInterface: '@App\Service\Embedding\OpenAiEmbeddingProvider'

    App\Service\Embedding\OpenAiEmbeddingProvider:
        arguments:
            $apiKey: '%env(OPENAI_API_KEY)%'
            $model: '%env(EMBEDDING_MODEL)%'

    App\Service\Chat\LlmProviderInterface: '@App\Service\Chat\OpenAiChatProvider'

    App\Service\Chat\OpenAiChatProvider:
        arguments:
            $apiKey: '%env(OPENAI_API_KEY)%'
            $model: '%env(CHAT_MODEL)%'

    App\Service\Chat\RagService:
        arguments:
            $topK: '%app.rag_top_k%'
            $candidateBatchSize: '%app.rag_candidate_batch_size%'
            $minScore: '%app.rag_min_score%'

    App\Service\Document\DocumentIndexer:
        arguments:
            $chunkSize: '%app.chunk_size%'
            $chunkOverlap: '%app.chunk_overlap%'

    App\Service\Document\DocumentUploadService:
        arguments:
            $storageDirectory: '%app.documents_dir%'
            $maxBytes: '%app.documents_max_bytes%'
            $extractors: !tagged_iterator app.text_extractor
