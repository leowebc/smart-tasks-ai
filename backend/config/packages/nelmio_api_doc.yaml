nelmio_api_doc:
    documentation:
        info:
            title: Smart Tasks AI API
            description: API para tarefas, documentos, Web Scraping e chat RAG.
            version: 1.0.0
        tags:
            - { name: Autenticação }
            - { name: Tarefas }
            - { name: Documentos }
            - { name: Fontes }
            - { name: Chat }
        components:
            securitySchemes:
                BearerAuth:
                    type: http
                    scheme: bearer
                    bearerFormat: JWT
            schemas:
                Error:
                    type: object
                    properties:
                        error: { type: string }
                Task:
                    type: object
                    properties:
                        id: { type: integer }
                        user_id: { type: integer }
                        title: { type: string }
                        description: { type: string, nullable: true }
                        status:
                            type: string
                            enum: [pending, in_progress, completed]
                        created_at: { type: string, format: date-time, nullable: true }
                        updated_at: { type: string, format: date-time, nullable: true }
                TaskInput:
                    type: object
                    required: [title]
                    properties:
                        title: { type: string, maxLength: 255 }
                        description: { type: string, nullable: true }
                        status:
                            type: string
                            enum: [pending, in_progress, completed]
                            default: pending
                Document:
                    type: object
                    properties:
                        id: { type: integer }
                        original_name: { type: string }
                        extension: { type: string }
                        mime_type: { type: string }
                        size_bytes: { type: integer }
                        status:
                            type: string
                            enum: [processing, ready, failed]
                        chunk_count: { type: integer }
                        source_url: { type: string, nullable: true }
                        error_message: { type: string, nullable: true }
                        created_at: { type: string, format: date-time, nullable: true }
                        updated_at: { type: string, format: date-time, nullable: true }
                ChatResponse:
                    type: object
                    properties:
                        answer: { type: string }
                        sources:
                            type: array
                            items: { type: object }
                        excerpts:
                            type: array
                            items: { type: object }
                        sufficient: { type: boolean }
                        retrieval: { type: string, example: rag }
        security:
            - BearerAuth: []
        paths:
            /api/register:
                post:
                    tags: [Autenticação]
                    summary: Cadastra um usuário
                    security: []
                    requestBody:
                        required: true
                        content:
                            application/json:
                                schema:
                                    type: object
                                    required: [username, password]
                                    properties:
                                        username: { type: string, maxLength: 50 }
                                        password: { type: string, format: password }
                    responses:
                        '201': { description: Usuário criado }
                        '400':
                            description: Dados inválidos
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/Error' }
                        '409': { description: Nome de usuário já utilizado }
            /api/login:
                post:
                    tags: [Autenticação]
                    summary: Autentica e retorna um JWT
                    security: []
                    requestBody:
                        required: true
                        content:
                            application/json:
                                schema:
                                    type: object
                                    required: [username, password]
                                    properties:
                                        username: { type: string }
                                        password: { type: string, format: password }
                    responses:
                        '200':
                            description: Login realizado
                            content:
                                application/json:
                                    schema:
                                        type: object
                                        properties:
                                            token: { type: string }
                        '401': { description: Credenciais inválidas }
            /api/tasks:
                get:
                    tags: [Tarefas]
                    summary: Lista as tarefas do usuário
                    responses:
                        '200':
                            description: Lista de tarefas
                            content:
                                application/json:
                                    schema:
                                        type: array
                                        items: { $ref: '#/components/schemas/Task' }
                        '401': { description: JWT ausente ou inválido }
                post:
                    tags: [Tarefas]
                    summary: Cria uma tarefa
                    requestBody:
                        required: true
                        content:
                            application/json:
                                schema: { $ref: '#/components/schemas/TaskInput' }
                    responses:
                        '201':
                            description: Tarefa criada
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/Task' }
                        '400': { description: Dados inválidos }
                        '401': { description: JWT ausente ou inválido }
            /api/tasks/{id}:
                parameters:
                    - name: id
                      in: path
                      required: true
                      schema: { type: integer }
                put:
                    tags: [Tarefas]
                    summary: Atualiza uma tarefa
                    requestBody:
                        required: true
                        content:
                            application/json:
                                schema: { $ref: '#/components/schemas/TaskInput' }
                    responses:
                        '200':
                            description: Tarefa atualizada
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/Task' }
                        '400': { description: Dados inválidos }
                        '404': { description: Tarefa não encontrada }
                delete:
                    tags: [Tarefas]
                    summary: Exclui uma tarefa
                    responses:
                        '200': { description: Tarefa excluída }
                        '404': { description: Tarefa não encontrada }
            /api/documents:
                get:
                    tags: [Documentos]
                    summary: Lista os documentos enviados
                    responses:
                        '200':
                            description: Lista de documentos
                            content:
                                application/json:
                                    schema:
                                        type: array
                                        items: { $ref: '#/components/schemas/Document' }
                post:
                    tags: [Documentos]
                    summary: Envia e processa um PDF ou TXT
                    requestBody:
                        required: true
                        content:
                            multipart/form-data:
                                schema:
                                    type: object
                                    required: [file]
                                    properties:
                                        file: { type: string, format: binary }
                    responses:
                        '201': { description: Documento processado }
                        '400': { description: Arquivo inválido }
                        '422': { description: 'Documento recebido, mas o processamento falhou' }
            /api/documents/{id}:
                parameters:
                    - name: id
                      in: path
                      required: true
                      schema: { type: integer }
                get:
                    tags: [Documentos]
                    summary: Exibe um documento e seus chunks
                    responses:
                        '200':
                            description: Documento encontrado
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/Document' }
                        '404': { description: Documento não encontrado }
                delete:
                    tags: [Documentos]
                    summary: Exclui um documento enviado
                    responses:
                        '200': { description: Documento excluído }
                        '404': { description: Documento não encontrado }
            /api/documents/{id}/retry:
                parameters:
                    - name: id
                      in: path
                      required: true
                      schema: { type: integer }
                post:
                    tags: [Documentos]
                    summary: Reprocessa um documento com falha
                    responses:
                        '200': { description: Documento reprocessado }
                        '400': { description: Documento não pode ser reprocessado }
                        '404': { description: Documento não encontrado }
                        '422': { description: O reprocessamento falhou }
            /api/sources:
                get:
                    tags: [Fontes]
                    summary: Lista páginas e grupos importados
                    responses:
                        '200':
                            description: Catálogo de fontes
                            content:
                                application/json:
                                    schema: { type: object }
                post:
                    tags: [Fontes]
                    summary: Importa uma página ou um site
                    requestBody:
                        required: true
                        content:
                            application/json:
                                schema:
                                    type: object
                                    required: [url]
                                    properties:
                                        url: { type: string, format: uri }
                                        follow_links: { type: boolean, default: false }
                                        max_pages: { type: integer, minimum: 1, maximum: 200, default: 50 }
                    responses:
                        '200': { description: Grupo de páginas importado }
                        '201': { description: Página importada }
                        '400': { description: URL ou limite inválido }
                        '422': { description: Não foi possível processar a fonte }
            /api/sources/{id}:
                parameters:
                    - name: id
                      in: path
                      required: true
                      schema: { type: integer }
                delete:
                    tags: [Fontes]
                    summary: Exclui uma página importada
                    responses:
                        '200': { description: Fonte excluída }
                        '404': { description: Fonte não encontrada }
            /api/sources/{id}/retry:
                parameters:
                    - name: id
                      in: path
                      required: true
                      schema: { type: integer }
                post:
                    tags: [Fontes]
                    summary: Reprocessa uma página com falha
                    responses:
                        '200': { description: Fonte reprocessada }
                        '400': { description: Fonte não pode ser reprocessada }
                        '404': { description: Fonte não encontrada }
                        '422': { description: O reprocessamento falhou }
            /api/source-imports/{id}:
                parameters:
                    - name: id
                      in: path
                      required: true
                      schema: { type: integer }
                delete:
                    tags: [Fontes]
                    summary: Exclui um grupo de páginas importadas
                    responses:
                        '200': { description: Importação excluída }
                        '404': { description: Importação não encontrada }
            /api/chat:
                post:
                    tags: [Chat]
                    summary: Responde usando somente as fontes selecionadas
                    requestBody:
                        required: true
                        content:
                            application/json:
                                schema:
                                    type: object
                                    required: [question, source_ids]
                                    properties:
                                        question: { type: string, minLength: 1, maxLength: 1000 }
                                        source_ids:
                                            type: array
                                            minItems: 1
                                            items: { type: integer }
                    responses:
                        '200':
                            description: Resposta RAG
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/ChatResponse' }
                        '400': { description: Pergunta ou fontes inválidas }
                        '404': { description: Uma fonte não pertence ao usuário }
                        '502': { description: Falha no provedor de IA }
    areas:
        path_patterns:
            - ^/api(?!/doc(?:\.json)?$)
